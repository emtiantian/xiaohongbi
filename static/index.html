<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF2442">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小红笔">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>小红笔 - 小红书文案生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 90px;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    .header {
      text-align: center;
      padding: 28px 0 16px;
    }
    .header .icon { font-size: 36px; }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #FF2442, #FF6B7A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 3px;
    }
    .header p { font-size: 14px; color: #86868b; }

    /* 安装提示 */
    .install-banner {
      display: none;
      background: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      font-size: 14px;
      align-items: center;
      gap: 8px;
    }
    .install-banner .icon-emoji { font-size: 24px; }
    .install-banner .text { flex: 1; line-height: 1.4; }
    .install-banner .close-btn {
      background: none; border: none; font-size: 18px; color: #86868b; cursor: pointer; padding: 4px;
    }

    /* 主 Tab */
    .main-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      background: #e8e8ed;
      border-radius: 12px;
      padding: 3px;
    }
    .main-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #86868b;
      background: transparent;
      cursor: pointer;
      transition: all .25s;
    }
    .main-tab.active {
      background: #fff;
      color: #1d1d1f;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* 输入卡片 */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1d1d1f;
    }
    .card input, .card select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fafafa;
      transition: border-color .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .card input:focus, .card select:focus {
      outline: none;
      border-color: #FF2442;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .row > div { flex: 1; }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FF2442, #FF6B7A);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 16px;
    }
    .btn-primary:active { transform: scale(.97); opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .loading {
      text-align: center;
      padding: 32px 0;
      display: none;
    }
    .loading .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid #e5e5ea;
      border-top-color: #FF2442;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { margin-top: 12px; font-size: 14px; color: #86868b; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: #f0f0f3;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #86868b;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active { background: #FF2442; color: #fff; }

    .version-panel { display: none; }
    .version-panel.active { display: block; }

    .result-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
      min-height: 160px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-row button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-copy { background: #f0f0f3; color: #1d1d1f; }
    .btn-copy:active { background: #e0e0e5; }

    .error-msg {
      background: #fff0f0;
      color: #c41e3a;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      margin-top: 12px;
    }

    /* 历史列表 */
    .history-list { margin-top: 16px; }
    .history-empty {
      text-align: center;
      padding: 48px 20px;
      color: #86868b;
      font-size: 14px;
    }
    .history-empty .big-emoji { font-size: 48px; margin-bottom: 12px; }
    .history-item {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .history-item .meta {
      font-size: 12px;
      color: #86868b;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .history-item .preview {
      font-size: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #3a3a3c;
    }
    .history-item .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .history-item .actions button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .history-item .actions .view-btn { background: #f0f0f3; color: #1d1d1f; }
    .history-item .actions .del-btn { background: #fff0f0; color: #c41e3a; }

    /* 详情弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #f5f5f7;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-content .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-content .modal-header h3 { font-size: 18px; }
    .modal-content .modal-close {
      background: none; border: none; font-size: 24px; color: #86868b; cursor: pointer; padding: 4px;
    }

    .footer {
      text-align: center;
      padding: 24px 0;
      font-size: 12px;
      color: #c7c7cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🖊️</div>
      <h1>小红笔</h1>
      <p>小红书文案 · 一键生成</p>
    </div>

    <!-- PWA 安装提示 -->
    <div class="install-banner" id="installBanner">
      <span class="icon-emoji">📱</span>
      <span class="text">把小红笔添加到主屏幕，像 App 一样使用</span>
      <button class="close-btn" onclick="dismissInstall()">✕</button>
    </div>

    <!-- 主 Tab -->
    <div class="main-tabs">
      <button class="main-tab active" data-tab="generate">✍️ 生成</button>
      <button class="main-tab" data-tab="history">📋 历史 <span id="historyBadge" style="display:none;background:#FF2442;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px;">0</span></button>
    </div>

    <!-- 生成面板 -->
    <div class="panel active" id="panel-generate">
      <div class="card">
        <label for="topic">产品 / 话题</label>
        <input type="text" id="topic" placeholder="比如：平价面霜、周末去哪里..." autocomplete="off">
        <div class="row">
          <div>
            <label for="style">文案风格</label>
            <select id="style">
              <option value="种草">🌿 种草</option>
              <option value="干货">📚 干货</option>
              <option value="测评">🔍 测评</option>
              <option value="日常">☀️ 日常</option>
            </select>
          </div>
          <div>
            <label for="length">文案长度</label>
            <select id="length">
              <option value="短">短 (50-80字)</option>
              <option value="中" selected>中 (150-250字)</option>
              <option value="长">长 (300-500字)</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" id="generateBtn">✨ 一键生成</button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在为你写文案…</p>
      </div>
      <div class="error-msg" id="errorMsg"></div>

      <div id="resultArea" style="display:none">
        <div class="tabs" id="tabs"></div>
        <div id="versions"></div>
      </div>
    </div>

    <!-- 历史面板 -->
    <div class="panel" id="panel-history">
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="footer">由 DeepSeek 提供支持 · 小红书专属文案工具</div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <div class="modal-header">
        <h3 id="modalTitle">文案详情</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ========== PWA ==========
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js');
      });
    }

    const isStandalone = window.navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!isStandalone && isIOS && !localStorage.getItem('installDismissed')) {
      document.getElementById('installBanner').style.display = 'flex';
    }
    function dismissInstall() {
      document.getElementById('installBanner').style.display = 'none';
      localStorage.setItem('installDismissed', '1');
    }

    // ========== Tab 切换 ==========
    document.querySelectorAll('.main-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'history') renderHistory();
      });
    });

    // ========== 本地存储 ==========
    const STORAGE_KEY = 'xiaohongbi_history';

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveToHistory(topic, style, versions) {
      const list = getHistory();
      list.unshift({
        id: Date.now(),
        topic,
        style,
        versions,
        time: new Date().toLocaleString('zh-CN'),
        timestamp: Date.now(),
      });
      if (list.length > 50) list.length = 50;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateBadge();
    }

    function deleteHistory(id) {
      let list = getHistory();
      list = list.filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateBadge();
      renderHistory();
    }

    function updateBadge() {
      const badge = document.getElementById('historyBadge');
      const count = getHistory().length;
      badge.textContent = count > 99 ? '99+' : count;
      badge.style.display = count > 0 ? 'inline' : 'none';
    }

    function renderHistory() {
      const list = getHistory();
      const container = document.getElementById('historyList');
      if (list.length === 0) {
        container.innerHTML = `<div class="history-empty">
          <div class="big-emoji">📝</div>
          <p>还没有保存的文案<br>生成文案后会自动保存在这里</p>
        </div>`;
        return;
      }
      container.innerHTML = list.map(item => {
        const preview = (item.versions && item.versions[0]) || '';
        const firstLine = preview.split('\n')[0] || preview.slice(0, 60);
        return `<div class="history-item">
          <div class="meta">
            <span>${escHtml(item.topic)} · ${escHtml(item.style)}</span>
            <span>${escHtml(item.time)}</span>
          </div>
          <div class="preview">${escHtml(firstLine)}</div>
          <div class="actions">
            <button class="view-btn" onclick="openHistoryDetail(${item.id})">👁️ 查看</button>
            <button class="del-btn" onclick="deleteHistory(${item.id})">🗑️ 删除</button>
          </div>
        </div>`;
      }).join('');
    }

    function openHistoryDetail(id) {
      const list = getHistory();
      const item = list.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalTitle').textContent = `${item.topic} · ${item.style}`;
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      (item.versions || []).forEach((text, i) => {
        const box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);';
        const label = document.createElement('div');
        label.style.cssText = 'font-size:12px;color:#86868b;margin-bottom:8px;font-weight:600;';
        label.textContent = `版本 ${i + 1}`;
        const content = document.createElement('div');
        content.style.cssText = 'white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:15px;';
        content.textContent = text;
        const copyBtn = document.createElement('button');
        copyBtn.style.cssText = 'width:100%;padding:12px;background:#f0f0f3;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;';
        copyBtn.textContent = '📋 复制';
        copyBtn.addEventListener('click', () => copyText(text, copyBtn));

        box.appendChild(label);
        box.appendChild(content);
        box.appendChild(copyBtn);
        body.appendChild(box);
      });

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    function escHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // ========== 生成 ==========
    const topicInput = document.getElementById('topic');
    const styleSelect = document.getElementById('style');
    const lengthSelect = document.getElementById('length');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');
    const resultArea = document.getElementById('resultArea');
    const tabs = document.getElementById('tabs');
    const versions = document.getElementById('versions');

    let currentTopic = '';
    let currentStyle = '';
    let currentVersions = [];

    generateBtn.addEventListener('click', generate);
    topicInput.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

    async function generate() {
      const topic = topicInput.value.trim();
      if (!topic) {
        showError('请输入话题或产品关键词');
        topicInput.focus();
        return;
      }

      currentTopic = topic;
      currentStyle = styleSelect.options[styleSelect.selectedIndex].text.replace(/^[^\s]+\s*/, '');

      hideError();
      resultArea.style.display = 'none';
      loading.style.display = 'block';
      generateBtn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic,
            style: currentStyle,
            length: lengthSelect.value,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '生成失败');

        currentVersions = data.versions && data.versions.length > 0 ? data.versions : [data.raw];
        showVersions(currentVersions);
        saveToHistory(currentTopic, currentStyle, currentVersions);
      } catch (err) {
        showError(err.message);
      } finally {
        loading.style.display = 'none';
        generateBtn.disabled = false;
      }
    }

    function showVersions(list) {
      versions.innerHTML = '';
      tabs.innerHTML = '';
      currentVersions = list;

      list.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn${i === 0 ? ' active' : ''}`;
        btn.textContent = `版本 ${i + 1}`;
        btn.addEventListener('click', () => switchTab(i));
        tabs.appendChild(btn);

        const panel = document.createElement('div');
        panel.className = `version-panel${i === 0 ? ' active' : ''}`;
        const box = document.createElement('div');
        box.className = 'result-box';
        box.textContent = text;

        const actions = document.createElement('div');
        actions.className = 'btn-row';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn-copy';
        copyBtn.textContent = '📋 复制';
        copyBtn.addEventListener('click', () => copyText(text, copyBtn));

        actions.appendChild(copyBtn);
        panel.appendChild(box);
        panel.appendChild(actions);
        versions.appendChild(panel);
      });

      resultArea.style.display = 'block';
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchTab(index) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === index));
      document.querySelectorAll('.version-panel').forEach((p, i) => p.classList.toggle('active', i === index));
    }

    async function copyText(text, btn) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        const orig = btn.textContent;
        btn.textContent = '✅ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      } catch { showError('复制失败，请手动选择复制'); }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
    function hideError() { errorMsg.style.display = 'none'; }

    updateBadge();
  </script>
</body>
</html>
