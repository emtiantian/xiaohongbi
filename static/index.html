<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF2442">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小红笔">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>小红笔 - 小红书文案生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 90px;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 16px; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 4px 16px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header .icon { font-size: 28px; }
    .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #FF2442, #FF6B7A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-right { font-size: 13px; color: #86868b; }

    .main-tabs {
      display: flex; gap: 0; margin-bottom: 16px;
      background: #e8e8ed; border-radius: 12px; padding: 3px;
    }
    .main-tab {
      flex: 1; padding: 10px; text-align: center; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 600;
      color: #86868b; background: transparent; cursor: pointer; transition: all .25s;
    }
    .main-tab.active { background: #fff; color: #1d1d1f; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .panel { display: none; }
    .panel.active { display: block; }

    .style-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px;
    }
    .style-card {
      background: #fff; border: 2px solid transparent; border-radius: 12px;
      padding: 10px 4px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; transition: all .2s; user-select: none;
    }
    .style-card:active { transform: scale(.95); }
    .style-card .emoji { font-size: 20px; display: block; margin-bottom: 2px; }
    .style-card .label { font-size: 12px; font-weight: 600; }
    .style-card.selected { border-color: #FF2442; background: #fff5f5; }
    @media (max-width: 420px) {
      .style-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .input-section {
      background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .input-section label {
      display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1d1d1f;
    }
    .input-section .label-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .input-section .label-row .hint { font-size: 12px; color: #86868b; font-weight: 400; }

    .topic-input {
      width: 100%; padding: 14px 16px; border: 1.5px solid #e5e5ea;
      border-radius: 12px; font-size: 16px; font-family: inherit; background: #fafafa;
      transition: border-color .2s;
    }
    .topic-input:focus { outline: none; border-color: #FF2442; background: #fff; }

    .ref-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e5e5ea;
      border-radius: 12px; font-size: 14px; font-family: inherit; background: #fafafa;
      resize: vertical; min-height: 80px; line-height: 1.5;
      transition: border-color .2s;
    }
    .ref-input:focus { outline: none; border-color: #FF2442; background: #fff; }

    .length-row {
      display: flex; gap: 8px; margin-top: 16px;
    }
    .length-btn {
      flex: 1; padding: 10px; text-align: center;
      background: #f0f0f3; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 500; color: #86868b; cursor: pointer; transition: all .2s;
    }
    .length-btn.active { background: #1d1d1f; color: #fff; }

    .btn-primary {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #FF2442, #FF6B7A); color: #fff;
      border: none; border-radius: 12px; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: opacity .2s, transform .1s; margin-top: 16px;
    }
    .btn-primary:active { transform: scale(.97); opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .loading { text-align: center; padding: 40px 0; display: none; }
    .loading .spinner {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid #e5e5ea; border-top-color: #FF2442; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { margin-top: 12px; font-size: 14px; color: #86868b; }

    .error-msg {
      background: #fff0f0; color: #c41e3a; padding: 14px 16px;
      border-radius: 12px; font-size: 14px; display: none; margin-top: 12px;
    }

    .result-item {
      background: #fff; border-radius: 16px; overflow: hidden;
      margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
      width: 100%; height: 180px;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #c41e3a; text-align: center; padding: 20px; line-height: 1.5;
    }
    .result-body { padding: 16px 20px 12px; }
    .result-title { font-size: 17px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
    .result-content { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #3a3a3c; }
    .result-tags { margin-top: 10px; font-size: 13px; color: #FF2442; }
    .result-actions { display: flex; gap: 8px; padding: 0 20px 20px; }
    .result-actions button {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-copy { background: #f0f0f3; color: #1d1d1f; }
    .btn-copy:active { background: #e0e0e5; }
    .btn-xhs { background: #FF2442; color: #fff; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-xhs:active { opacity: .85; }
    .btn-xhs .icon { font-size: 16px; }

    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.8); color: #fff; padding: 14px 24px;
      border-radius: 12px; font-size: 15px; z-index: 200;
      animation: toastAnim 1.8s forwards; pointer-events: none;
    }
    @keyframes toastAnim {
      0% { opacity:1; transform:translate(-50%,-50%) scale(.9); }
      15% { opacity:1; transform:translate(-50%,-50%) scale(1); }
      75% { opacity:1; }
      100% { opacity:0; }
    }

    .history-list { margin-top: 16px; }
    .history-empty { text-align: center; padding: 48px 20px; color: #86868b; font-size: 14px; }
    .history-empty .big-emoji { font-size: 48px; margin-bottom: 12px; }
    .history-item {
      background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .history-item .meta { font-size: 12px; color: #86868b; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .history-item .preview { font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #3a3a3c; }
    .history-item .actions { display: flex; gap: 8px; margin-top: 10px; }
    .history-item .actions button { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .history-item .actions .view-btn { background: #f0f0f3; color: #1d1d1f; }
    .history-item .actions .del-btn { background: #fff0f0; color: #c41e3a; }
    .history-badge { display:none; background:#FF2442; color:#fff; border-radius:10px; padding:1px 6px; font-size:11px; margin-left:4px; }

    .modal-overlay {
      display: none; position: fixed; top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,.4); z-index: 100;
      justify-content: center; align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #f5f5f7; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto;
      padding: 20px; animation: slideUp .3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-content .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-content .modal-header h3 { font-size: 18px; }
    .modal-close { background: none; border: none; font-size: 24px; color: #86868b; cursor: pointer; padding: 4px; }
    .modal-body .mv { margin-bottom: 14px; }
    .modal-body .mv .vl { font-size: 12px; color: #86868b; font-weight: 600; margin-bottom: 6px; }
    .modal-body .mv .vb { background: #fff; border-radius: 12px; padding: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 14px; }

    .footer { text-align: center; padding: 24px 0; font-size: 12px; color: #c7c7cc; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <span class="icon">🖊️</span>
      <h1>小红笔</h1>
    </div>
    <div class="header-right">基于真实素材</div>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" data-tab="generate">✍️ 生成</button>
    <button class="main-tab" data-tab="history">📋 历史 <span class="history-badge" id="historyBadge">0</span></button>
  </div>

  <!-- 生成面板 -->
  <div class="panel active" id="panel-generate">
    <div class="input-section">
      <label>文案风格</label>
      <div class="style-grid" id="styleGrid"></div>

      <label for="topic">话题 / 产品名称</label>
      <input class="topic-input" id="topic" placeholder="比如：水果捞、平价面霜、周末去哪..." autocomplete="off">

      <div style="margin-top:16px;">
        <div class="label-row">
          <label for="refs">参考信息（选填）</label>
          <span class="hint">填了AI就不会瞎编</span>
        </div>
        <textarea class="ref-input" id="refs" placeholder="把你了解的真实信息写在这里，AI只会基于这些写&#10;比如：&#10;水果：芒果、西瓜、火龙果、葡萄&#10;价格：15元/斤自选，椰奶底+5元&#10;位置：学校北门第二个摊位&#10;口感：清爽不腻，椰奶味很浓"></textarea>
      </div>

      <label style="margin-top:16px;display:block;">文案篇幅</label>
      <div class="length-row">
        <button class="length-btn" data-length="短">短 50-100字</button>
        <button class="length-btn active" data-length="中">中 150-250字</button>
        <button class="length-btn" data-length="长">长 300-500字</button>
      </div>

      <button class="btn-primary" id="generateBtn">✨ 生成文案</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在为你写文案…</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div id="resultArea"></div>
  </div>

  <!-- 历史面板 -->
  <div class="panel" id="panel-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="footer">基于 DeepSeek · 小红书专属文案工具</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">文案详情</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ======== 风格配置 ========
const STYLE_LIST = [
  { emoji: '🌿', label: '种草' },     { emoji: '⚠️', label: '避雷' },
  { emoji: '🔍', label: '测评' },     { emoji: '🎁', label: '好物分享' },
  { emoji: '📖', label: '教程' },     { emoji: '☀️', label: '日常' },
  { emoji: '👗', label: '穿搭' },     { emoji: '🍜', label: '美食' },
  { emoji: '✈️', label: '旅行' },     { emoji: '💬', label: '情绪共鸣' },
];

  ['#fce4ec','#f8bbd0'], ['#e3f2fd','#bbdefb'], ['#fff3e0','#ffe0b2'],
  ['#e8f5e9','#c8e6c9'], ['#f3e5f5','#e1bee7'], ['#e0f7fa','#b2ebf2'],
  ['#fff8e1','#ffecb3'], ['#fbe9e7','#ffccbc'], ['#f1f8e9','#dcedc8'],
  ['#ede7f6','#d1c4e9'],
];

// ======== PWA ========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
}

// ======== 风格卡片 ========
const styleGrid = document.getElementById('styleGrid');
let selectedStyle = '种草';

STYLE_LIST.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = `style-card${s.label === selectedStyle ? ' selected' : ''}`;
  card.dataset.style = s.label;
  card.innerHTML = `<span class="emoji">${s.emoji}</span><span class="label">${s.label}</span>`;
  card.addEventListener('click', () => {
    document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedStyle = s.label;
  });
  styleGrid.appendChild(card);
});

// ======== 长度 ========
document.querySelectorAll('.length-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
function getSelectedLength() {
  return document.querySelector('.length-btn.active')?.dataset.length || '中';
}

// ======== 本地存储 ========
const STORAGE_KEY = 'xiaohongbi_history';

function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveToHistory(topic, style, refs, versions) {
  const list = getHistory();
  list.unshift({ id: Date.now(), topic, style, refs, versions, time: new Date().toLocaleString('zh-CN') });
  if (list.length > 50) list.length = 50;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  updateBadge();
}
function deleteHistory(id) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(getHistory().filter(i => i.id !== id)));
  updateBadge(); renderHistory();
}
function updateBadge() {
  const badge = document.getElementById('historyBadge');
  const count = getHistory().length;
  badge.textContent = count > 99 ? '99+' : count;
  badge.style.display = count > 0 ? 'inline' : 'none';
}

function renderHistory() {
  const list = getHistory();
  const container = document.getElementById('historyList');
  if (!list.length) {
    container.innerHTML = `<div class="history-empty"><div class="big-emoji">📝</div><p>还没有保存的文案<br>生成的文案会自动保存在这里</p></div>`;
    return;
  }
  container.innerHTML = list.map(item => {
    const preview = (item.versions?.[0]?.content || item.versions?.[0] || '').split('\n')[0];
    return `<div class="history-item">
      <div class="meta"><span>${esc(item.topic)} · ${esc(item.style)}</span><span>${esc(item.time)}</span></div>
      <div class="preview">${esc(preview)}</div>
      <div class="actions">
        <button class="view-btn" onclick="openHistoryDetail(${item.id})">👁️ 查看</button>
        <button class="del-btn" onclick="deleteHistory(${item.id})">🗑️ 删除</button>
      </div>
    </div>`;
  }).join('');
}

function openHistoryDetail(id) {
  const item = getHistory().find(i => i.id === id);
  if (!item) return;
  document.getElementById('modalTitle').textContent = `${item.topic} · ${item.style}`;
  const body = document.getElementById('modalBody');
  body.innerHTML = (item.versions || []).map((v, i) => {
    const text = v.content || v;
    return `<div class="mv"><div class="vl">版本 ${i+1}</div><div class="vb">${esc(text)}</div></div>`;
  }).join('');
  document.getElementById('modalOverlay').classList.add('active');
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ======== 弹窗 ========
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('active'));
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('active'); });

// ======== Tab ========
document.querySelectorAll('.main-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'history') renderHistory();
  });
});

// ======== Toast ========
function toast(msg) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1900);
}

// ======== 生成 ========
const topicInput = document.getElementById('topic');
const refsInput = document.getElementById('refs');
const generateBtn = document.getElementById('generateBtn');
const loading = document.getElementById('loading');
const errorMsg = document.getElementById('errorMsg');
const resultArea = document.getElementById('resultArea');

let currentVersions = [];
let currentTopic = '';

generateBtn.addEventListener('click', generate);
topicInput.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

async function generate() {
  const topic = topicInput.value.trim();
  if (!topic) { showError('请输入话题或产品名称'); topicInput.focus(); return; }

  currentTopic = topic;
  hideError();
  resultArea.innerHTML = '';
  loading.style.display = 'block';
  generateBtn.disabled = true;

  try {
    const body = {
      topic,
      style: selectedStyle,
      length: getSelectedLength(),
      count: 2,
      references: refsInput.value.trim(),
    };

    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '生成失败');

    currentVersions = data.versions || [];
    renderResults(currentVersions);
    saveToHistory(topic, selectedStyle, refsInput.value.trim(), currentVersions);
  } catch (err) {
    showError(err.message);
  } finally {
    loading.style.display = 'none';
    generateBtn.disabled = false;
  }
}

function renderResults(versions) {
  resultArea.innerHTML = versions.map((v, i) => {
    return `<div class="result-item">
      <div class="result-body">
        <div class="result-title">${esc(v.title)}</div>
        <div class="result-content">${esc(v.content)}</div>
        ${v.tags ? `<div class="result-tags">${esc(v.tags)}</div>` : ''}
      </div>
      <div class="result-actions">
        <button class="btn-copy" onclick="copyAndGo(${i})">📋 复制 & 去小红书</button>
        <button class="btn-xhs" onclick="copyAndGo(${i})"><span class="icon">📕</span> 复制 & 去发布</button>
      </div>
    </div>`;
  }).join('');
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function getVersionText(i) {
  const v = currentVersions[i];
  if (!v) return '';
  return `${v.title}\n\n${v.content}\n${v.tags || ''}`;
}

async function copyAndGo(i) {
  const text = getVersionText(i);
  if (!text) return;

  let ok = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch { ok = false; }

  if (ok) {
    toast('✅ 文案已复制，正在打开小红书…');
  } else {
    toast('复制失败，请手动复制');
  }

  // 尝试跳转小红书 App，失败则打开网页版
  // iOS URL Scheme
  const xhsURL = 'xhsshare://publish';
  // 网页版 fallback
  const xhsWeb = 'https://www.xiaohongshu.com/explore';

  // 先试 App URL Scheme
  const link = document.createElement('a');
  link.href = xhsURL;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  // App 没响应就 fallback 到网页
  setTimeout(() => {
    window.open(xhsWeb, '_blank');
  }, 800);
}

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }
function hideError() { errorMsg.style.display = 'none'; }

// ======== 初始化 ========
updateBadge();
</script>
</body>
</html>
